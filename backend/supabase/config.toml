# ==============================================================================
# NOTtEodo Supabase Production Configuration (config.toml)
# ==============================================================================

project_id = "notteodo-sanctuary"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000", "notteodo://auth-callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.security]
# Minimum password length requirement
min_password_length = 8
# Rate limiting on authentication attempts to prevent credential stuffing
enable_manual_linking = false

[storage]
enabled = true
file_size_limit = "50MiB"

[edge_runtime]
enabled = true
port = 54323
inspector_port = 8083
