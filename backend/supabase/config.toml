# ==============================================================================
# NOTtEodo Supabase Production Configuration (config.toml)
# ==============================================================================

project_id = "notteodo-sanctuary"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000", "notteodo://auth-callback"]
# Short-lived access tokens; refresh tokens rotate and a reused one revokes the session.
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
# NIST SP 800-63B: length over composition rules. The app also blocks common and
# breached passwords (Have I Been Pwned k-anonymity check) before sign-up.
minimum_password_length = 10
password_requirements = ""

[auth.rate_limit]
# Per-IP limits against credential stuffing and email bombing.
email_sent = 2
sms_sent = 0
sign_in_sign_ups = 30
token_verifications = 30
token_refresh = 150

[auth.email]
enable_signup = true
double_confirm_changes = true
# Accounts must confirm their email before signing in.
enable_confirmations = true
# Changing the password requires a recent sign-in.
secure_password_change = true
max_frequency = "1m0s"
otp_length = 6
otp_expiry = 900

[auth.mfa]
max_enrolled_factors = 10

# Authenticator-app two-step verification (the app enforces AAL2 through RLS).
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

# Hosted projects (Pro plan and up) can also enable, in the dashboard:
#   * Leaked password protection (HaveIBeenPwned) on the server side
#   * [auth.sessions] timebox / inactivity_timeout
#   * CAPTCHA (hCaptcha / Turnstile) on sign-up and sign-in

[storage]
enabled = true
file_size_limit = "50MiB"

[edge_runtime]
enabled = true
port = 54323
inspector_port = 8083
