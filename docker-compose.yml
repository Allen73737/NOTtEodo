version: '3.8'

services:
  # ==============================================================================
  # 1. NOTtEodo Enterprise Web Frontend (Nginx Alpine + Flutter Web Production)
  # ==============================================================================
  sanctuary-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        APP_ENV: ${APP_ENV:-production}
        SUPABASE_URL: ${SUPABASE_URL:-}
        SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    container_name: sanctuary-web-prod
    restart: unless-stopped
    # Unprivileged nginx listens on 8080 inside the container.
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - APP_ENV=${APP_ENV:-production}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
    depends_on:
      sanctuary-db:
        condition: service_healthy
    networks:
      - sanctuary_network
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==============================================================================
  # 2. Hardened Postgres 15 Database with pgvector & Auto-Schema Migration
  # ==============================================================================
  sanctuary-db:
    image: ankane/pgvector:v0.5.1
    container_name: sanctuary-postgres-prod
    restart: unless-stopped
    # Tuned for the 1 GB limit below and a few hundred concurrent app users.
    # Clients connect through PostgREST/a pooler, so 200 server connections is plenty.
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c wal_compression=on
      -c idle_in_transaction_session_timeout=60s
      -c statement_timeout=15s
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
    # Reachable from this machine only; never publish Postgres to the network.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-notteodo}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # No default: compose refuses to start until a real password is set in .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (e.g. openssl rand -base64 32)}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - sanctuary_pgdata:/var/lib/postgresql/data
      - ./backend/docker-init:/docker-entrypoint-initdb.d:ro
      - ./backend/supabase/migrations:/migrations:ro
    networks:
      - sanctuary_network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-notteodo}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  sanctuary_network:
    name: sanctuary_network
    driver: bridge

volumes:
  sanctuary_pgdata:
    name: sanctuary_pgdata
