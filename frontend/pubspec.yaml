name: notteodo
description: "NOTtEodo — Notes. Tasks. Life. Completely free personal life organization suite."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  google_fonts: ^6.1.0
  lucide_icons_flutter: ^4.0.1
  supabase_flutter: ^2.3.4
  intl: ^0.19.0
  crypto: ^3.0.3
  shared_preferences: ^2.5.6
  uuid: ^4.6.0
  web: ^1.1.1
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  qr_flutter: ^4.1.0
  cupertino_icons: ^1.0.9
  http: ^1.6.0
  image_picker: ^1.2.4
  file_picker: ^13.3.2
  home_widget: ^0.10.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    # DM Sans, Space Grotesk and Bodoni Moda ship with the app, so the first launch
    # (and every offline launch) uses the right type. google_fonts finds them by name.
    - assets/google_fonts/
