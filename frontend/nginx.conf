# Rendered at container start by docker-entrypoint.sh (envsubst fills ${CSP_CONNECT_SRC}).
server_tokens off;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1k;      # static site: nothing is uploaded here
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;

    # Only the methods a static site needs.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/wasm image/svg+xml;

    # No dotfiles, source maps or backup files.
    location ~ /\.                    { return 404; }
    location ~* \.(map|bak|orig|swp)$ { return 404; }

    # The app shell and runtime config must never be served stale (matched first).
    location ~* ^/(index\.html|env\.js|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json|manifest\.json)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, max-age=0" always;
        try_files $uri =404;
    }

    # Other static assets (not content-hashed, so cached for a week rather than forever).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|wasm|otf|json)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, max-age=0" always;
        try_files $uri $uri/ /index.html;
    }
}
