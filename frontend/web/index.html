<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <title>NOTtEodo Sanctuary — Editorial Haute Horlogerie Life Operating System</title>
  <meta name="description" content="NOTtEodo Sanctuary — Enterprise sovereign personal productivity, zero-knowledge vault, offline-first notes, tasks, and Haute Horlogerie life operating system.">
  <meta name="keywords" content="sanctuary, productivity, zero-knowledge, offline-first, haute horlogerie, notes, tasks, vault, enterprise">
  <meta name="author" content="NOTtEodo Sanctuary">
  
  <!-- OpenGraph / Social Metadata -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="NOTtEodo Sanctuary — Notes. Tasks. Life.">
  <meta property="og:description" content="Enterprise sovereign personal productivity & Haute Horlogerie life operating system.">
  <meta property="og:image" content="icons/Icon-512.png">
  
  <!-- Twitter Card Metadata -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="NOTtEodo Sanctuary">
  <meta name="twitter:description" content="Enterprise sovereign personal productivity & Haute Horlogerie life operating system.">
  <meta name="twitter:image" content="icons/Icon-512.png">

  <!-- iOS PWA Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NOTtEodo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <!-- High-Performance Typography Preloads -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Cormorant+Garamond:ital,wght@0,400..700;1,400..700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #FAF7F0;
      --gold-primary: #D4AF37;
      --gold-secondary: #EAB368;
      --text-color: #1A242B;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #000000;
        --gold-primary: #D4AF37;
        --gold-secondary: #EAB368;
        --text-color: #F4F1EA;
      }
    }

    body {
      background-color: var(--bg-color);
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    #sanctuary-preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-color);
      z-index: 99999;
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.6s ease;
    }

    #sanctuary-preloader.loaded {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .monogram-container {
      position: relative;
      width: 88px;
      height: 88px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gyro-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 1.5px solid var(--gold-primary);
      border-top-color: transparent;
      border-bottom-color: transparent;
      animation: spinGyro 3.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .gyro-inner {
      position: absolute;
      width: 76%;
      height: 76%;
      border-radius: 50%;
      border: 1px dashed var(--gold-secondary);
      animation: spinGyroReverse 5.4s linear infinite;
    }

    .monogram-letter {
      font-family: 'Bodoni Moda', serif;
      font-size: 34px;
      font-weight: 700;
      color: var(--gold-primary);
      text-shadow: 0 0 16px rgba(212, 175, 55, 0.45);
      animation: pulseGlow 2.4s ease-in-out infinite alternate;
    }

    .brand-title {
      margin-top: 24px;
      font-family: 'Bodoni Moda', serif;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 4px;
      color: var(--text-color);
      text-transform: uppercase;
    }

    .brand-subtitle {
      margin-top: 6px;
      font-size: 10.5px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold-primary);
      font-weight: 600;
    }

    .loading-track {
      margin-top: 28px;
      width: 130px;
      height: 2px;
      background: rgba(212, 175, 55, 0.18);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }

    .loading-bar {
      position: absolute;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
      animation: sweepLoader 1.8s ease-in-out infinite;
    }

    @keyframes spinGyro {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes spinGyroReverse {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }

    @keyframes pulseGlow {
      0% { opacity: 0.85; transform: scale(0.97); }
      100% { opacity: 1.0; transform: scale(1.03); }
    }

    @keyframes sweepLoader {
      0% { left: -100%; }
      100% { left: 100%; }
    }
  </style>
</head>
<body>
  <!-- Haute Horlogerie Preloader -->
  <div id="sanctuary-preloader">
    <div class="monogram-container">
      <div class="gyro-ring"></div>
      <div class="gyro-inner"></div>
      <span class="monogram-letter">N</span>
    </div>
    <div class="brand-title">NOTtEodo</div>
    <div class="brand-subtitle">Sanctuary Horlogerie OS</div>
    <div class="loading-track">
      <div class="loading-bar"></div>
    </div>
  </div>

  <noscript>
    <div style="padding: 40px; text-align: center; font-family: sans-serif; color: #333;">
      <h2>JavaScript Required</h2>
      <p>NOTtEodo Sanctuary is a sovereign, zero-knowledge application that requires JavaScript for client-side cryptographic functions.</p>
    </div>
  </noscript>

  <script>
    // Smoothly dismiss preloader once Flutter first frame renders
    window.addEventListener('flutter-first-frame', function () {
      var preloader = document.getElementById('sanctuary-preloader');
      if (preloader) {
        preloader.classList.add('loaded');
        setTimeout(function () {
          preloader.remove();
        }, 650);
      }
    });

    // Fallback safety timeout if event hook is delayed
    window.addEventListener('load', function () {
      setTimeout(function () {
        var preloader = document.getElementById('sanctuary-preloader');
        if (preloader && !preloader.classList.contains('loaded')) {
          preloader.classList.add('loaded');
          setTimeout(function () { preloader.remove(); }, 650);
        }
      }, 3500);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
