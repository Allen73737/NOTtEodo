  <style>
    /* Tokens mirror LogoRevealScreen so the hand-off to Flutter is seamless. */
    :root {
      --bg: #FAF7F2;
      --ink: #182226;
      --subtext: #6B7A82;
      --accent: #D9725B;
      --support: #16282C;
      --track: #E5DDD0;
      --glow: rgba(217, 114, 91, 0.22);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #000000;
        --ink: #F7F4ED;
        --subtext: #A6A096;
        --accent: #E8927C;
        --support: #86CBB0;
        --track: #1A1A1A;
        --glow: rgba(232, 146, 124, 0.32);
      }
    }

    :root[data-theme="dark"] {
      --bg: #000000;
      --ink: #F7F4ED;
      --subtext: #A6A096;
      --accent: #E8927C;
      --support: #86CBB0;
      --track: #1A1A1A;
      --glow: rgba(232, 146, 124, 0.32);
    }

    html, body {
      background-color: var(--bg);
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    #sanctuary-preloader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--bg);
      z-index: 99999;
      transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.45s ease;
    }

    #sanctuary-preloader.loaded {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .atelier-light {
      position: absolute;
      left: 50%;
      top: calc(50% - 63px);
      width: 120vmax;
      height: 120vmax;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, var(--glow) 0%, transparent 32%);
      opacity: 0.35;
      pointer-events: none;
      animation: breathe 2.8s ease-in-out infinite;
    }

    .stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .seal {
      position: relative;
      width: 208px;
      height: 208px;
    }

    .seal svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .ring-ticks { animation: spin 72s linear infinite; transform-origin: 104px 104px; }
    .ring-comet { animation: spin 2.8s linear infinite; transform-origin: 104px 104px; }

    .seal svg.mark {
      position: absolute;
      left: 48px;
      top: 48px;
      width: 112px;
      height: 112px;
      filter: drop-shadow(0 0 5px var(--glow));
      animation: bloom 2.8s ease-in-out infinite;
    }

    .mark path {
      fill: none;
      stroke: url(#brand-ink);
      stroke-width: 4.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1 2;
      stroke-dashoffset: 1;
    }

    .ink-end { stop-color: var(--support); stop-color: color-mix(in srgb, var(--accent) 45%, var(--support)); }

    .mark .loop { animation: ink-loop 2.8s cubic-bezier(0.65, 0, 0.35, 1) infinite; }
    .mark .tail { animation: ink-tail 2.8s cubic-bezier(0.65, 0, 0.35, 1) infinite; }

    .wordmark {
      margin-top: 34px;
      height: 40px;
      font-family: 'Bodoni Moda', 'Didot', Georgia, serif;
      font-size: 40px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 2.6px;
      color: var(--ink);
      display: flex;
    }

    .wordmark span {
      display: inline-block;
      opacity: 0;
      transform: translateY(18px);
      animation: rise 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .rule {
      margin-top: 14px;
      width: 200px;
      height: 10px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .rule::before {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      transform: scaleX(0);
      animation: unfurl 0.9s 0.9s cubic-bezier(0.65, 0, 0.35, 1) forwards;
    }

    .rule::after {
      content: '';
      width: 5px;
      height: 5px;
      background: var(--accent);
      transform: rotate(45deg) scale(0);
      animation: diamond 0.5s 1.2s ease-out forwards;
    }

    .tagline {
      margin-top: 14px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3.4px;
      color: var(--accent);
      opacity: 0;
      animation: fade 0.8s 1.1s ease-out forwards;
    }

    .boot {
      position: absolute;
      left: 0;
      right: 0;
      bottom: calc(44px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      animation: fade 0.6s 0.3s ease-out forwards;
    }

    .silk {
      position: relative;
      width: 180px;
      height: 3px;
      border-radius: 3px;
      background: var(--track);
      overflow: hidden;
    }

    .silk::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 35%;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--accent), var(--support));
      box-shadow: 0 0 8px var(--support);
      animation: glide 1.8s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }

    .status {
      margin-top: 14px;
      min-height: 12px;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 2.4px;
      text-transform: uppercase;
      color: var(--subtext);
      transition: opacity 0.3s ease;
    }

    .status i {
      font-style: normal;
      color: var(--accent);
      animation: blink 1.4s infinite;
    }
    .status i:nth-child(2) { animation-delay: 0.18s; }
    .status i:nth-child(3) { animation-delay: 0.36s; }

    @keyframes ink-loop {
      0%   { stroke-dashoffset: 1; }
      45%  { stroke-dashoffset: 0; }
      72%  { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -1; }
    }

    @keyframes ink-tail {
      0%, 30% { stroke-dashoffset: 1; }
      55%  { stroke-dashoffset: 0; }
      78%  { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -1; }
    }

    @keyframes bloom {
      0%, 100% { filter: drop-shadow(0 0 2px var(--glow)); }
      55%      { filter: drop-shadow(0 0 10px var(--glow)); }
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.25; }
      55%      { opacity: 0.6; }
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes rise { to { opacity: 1; transform: translateY(0); } }
    @keyframes unfurl { to { transform: scaleX(1); } }
    @keyframes diamond { to { transform: rotate(45deg) scale(1); } }
    @keyframes fade { to { opacity: 1; } }
    @keyframes blink { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }

    @keyframes glide {
      0%   { left: -35%; }
      100% { left: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .mark path { animation: none !important; stroke-dashoffset: 0; }
      .ring-ticks, .ring-comet, .atelier-light, .mark { animation: none !important; }
      .wordmark span, .tagline, .boot { animation-duration: 0.01s !important; animation-delay: 0s !important; }
      .rule::before, .rule::after { animation-duration: 0.01s !important; animation-delay: 0s !important; }
      .silk::before { animation-duration: 4s; }
    }
  </style>
