<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="100%" height="100%">
  <defs>
    <!-- Drop Shadow for Cards -->
    <filter id="cardShadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <style>
    @keyframes pulseTimer {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(1.03); opacity: 1; filter: drop-shadow(0 0 4px #D4AF37); }
    }
    @keyframes pulseFab {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px rgba(217, 114, 91, 0.4)); }
      50% { transform: scale(1.06); filter: drop-shadow(0 0 12px rgba(217, 114, 91, 0.8)); }
    }
    @keyframes strikeTask {
      0%, 30% { stroke-dashoffset: 220; opacity: 0.2; }
      60%, 100% { stroke-dashoffset: 0; opacity: 0.6; }
    }
    @keyframes checkFill {
      0%, 30% { fill: transparent; }
      60%, 100% { fill: #D9725B; }
    }
    @keyframes waveAudio {
      0%, 100% { height: 6px; y: 11px; }
      50% { height: 18px; y: 5px; }
    }
    @keyframes waveAudio2 {
      0%, 100% { height: 16px; y: 6px; }
      50% { height: 8px; y: 10px; }
    }

    .timer-badge { transform-origin: 810px 42px; animation: pulseTimer 2s ease-in-out infinite; }
    .fab-glow { transform-origin: 490px 492px; animation: pulseFab 2.8s ease-in-out infinite; }
    .strike-line { stroke-dasharray: 220; animation: strikeTask 5s ease-in-out infinite; }
    .task-check { animation: checkFill 5s ease-in-out infinite; }
    .audio-bar-1 { animation: waveAudio 0.8s ease-in-out infinite; }
    .audio-bar-2 { animation: waveAudio2 0.7s ease-in-out infinite 0.2s; }
  </style>

  <!-- Pure Pitch Black OLED Canvas -->
  <rect width="980" height="540" rx="20" fill="#000000" stroke="#1E1E1E" stroke-width="2" />

  <!-- ========================================================================= -->
  <!-- 1. TOP APP BAR -->
  <!-- ========================================================================= -->
  <g id="topAppBar">
    <!-- Hamburger Menu Icon -->
    <g transform="translate(48, 32)" stroke="#F6F3ED" stroke-width="2.2" stroke-linecap="round">
      <line x1="0" y1="0" x2="22" y2="0" />
      <line x1="0" y1="7" x2="22" y2="7" />
      <line x1="0" y1="14" x2="22" y2="14" />
    </g>

    <!-- Clean Notteodo Wordmark -->
    <g transform="translate(94, 26)">
      <!-- Minimalist Hexagonal Mark -->
      <polygon points="12,4 20,9 20,19 12,24 4,19 4,9" fill="#D9725B" />
      <text x="32" y="22" font-family="'Bodoni Moda', 'Playfair Display', Georgia, serif" font-size="24" font-weight="700" fill="#F6F3ED" letter-spacing="1.2">
        Notteodo
      </text>
    </g>

    <!-- Search Icon Button -->
    <g transform="translate(710, 27)">
      <rect width="36" height="32" rx="8" fill="#0A0A0A" stroke="#1E1E1E" stroke-width="1" />
      <circle cx="16" cy="14" r="5.5" stroke="#A6A096" stroke-width="1.6" fill="none" />
      <line x1="20" y1="18" x2="24" y2="22" stroke="#A6A096" stroke-width="1.6" stroke-linecap="round" />
    </g>

    <!-- Focus Timer Complication: ⏱ 25:00 START -->
    <g transform="translate(758, 27)" class="timer-badge">
      <rect width="124" height="32" rx="16" fill="#0A0A0A" stroke="#D4AF37" stroke-width="1.2" />
      <circle cx="16" cy="16" r="6" stroke="#D4AF37" stroke-width="1.2" fill="none" />
      <polyline points="16,13 16,16 18.5,16" stroke="#D4AF37" stroke-width="1.2" fill="none" />
      <text x="32" y="21" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" fill="#F6F3ED" letter-spacing="0.5">
        25:00 <tspan fill="#D4AF37" font-size="10" font-weight="600">START</tspan>
      </text>
    </g>

    <!-- Profile Avatar: 'A' -->
    <g transform="translate(896, 27)">
      <circle cx="16" cy="16" r="16" fill="#D9725B" stroke="#1E1E1E" stroke-width="1" />
      <text x="16" y="22" text-anchor="middle" font-family="'Bodoni Moda', Georgia, serif" font-size="15" font-weight="700" fill="#FFFFFF">
        A
      </text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- 2. EDITORIAL GREETING -->
  <!-- ========================================================================= -->
  <g transform="translate(48, 92)">
    <text x="0" y="0" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#7E998A" letter-spacing="2">
      SUNDAY · MARCH 2
    </text>
    <text x="0" y="34" font-family="'Bodoni Moda', 'Playfair Display', Georgia, serif" font-size="34" font-weight="700" fill="#F6F3ED" letter-spacing="-0.3">
      Good evening, Allen.
    </text>
    <text x="0" y="56" font-family="'Bodoni Moda', Georgia, serif" font-style="italic" font-size="14" fill="#A6A096">
      "Make space for what matters."
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- 3. BENTO POD 1: TODAY'S RHYTHM (Left Card) -->
  <!-- ========================================================================= -->
  <g transform="translate(48, 175)" filter="url(#cardShadow)">
    <rect width="420" height="235" rx="16" fill="#0A0A0A" stroke="#1E1E1E" stroke-width="1.2" />

    <!-- Card Header -->
    <text x="24" y="36" font-family="'Bodoni Moda', Georgia, serif" font-size="19" font-weight="700" fill="#F6F3ED">
      Today's Rhythm
    </text>

    <!-- Priority Badge: 2 PRIORITIES -->
    <g transform="translate(290, 18)">
      <rect width="105" height="24" rx="12" fill="#121212" stroke="#D9725B" stroke-opacity="0.5" stroke-width="1" />
      <text x="14" y="16" font-family="'DM Sans', sans-serif" font-size="9" font-weight="700" fill="#E8927C" letter-spacing="1">
        2 PRIORITIES
      </text>
      <circle cx="93" cy="12" r="7" fill="#D9725B" />
      <text x="93" y="15.5" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">2</text>
    </g>

    <!-- Task 1: Completed Task -->
    <g transform="translate(20, 56)">
      <rect width="380" height="48" rx="8" fill="#121212" stroke="#1E1E1E" stroke-width="1" />
      <circle cx="26" cy="24" r="10" class="task-check" stroke="#D9725B" stroke-width="1.5" />
      <polyline points="21,24 24,27 31,20" stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <text x="48" y="20" font-family="'DM Sans', sans-serif" font-size="12" fill="#A6A096" opacity="0.6">
        Finalize Computer Networks Unit 1 revision notes
      </text>
      <line x1="48" y1="16" x2="330" y2="16" stroke="#D9725B" stroke-width="1.5" class="strike-line" />
      <text x="48" y="36" font-family="'DM Sans', sans-serif" font-size="10" fill="#666666">
        Morning · High Priority
      </text>
    </g>

    <!-- Task 2: Active Task -->
    <g transform="translate(20, 112)">
      <rect width="380" height="48" rx="8" fill="#121212" stroke="#1E1E1E" stroke-width="1" />
      <circle cx="26" cy="24" r="10" stroke="#444444" stroke-width="1.5" fill="none" />
      <text x="48" y="20" font-family="'DM Sans', sans-serif" font-size="12" font-weight="500" fill="#F6F3ED">
        Review Goa Trip 2026 expense splits with Rahul
      </text>
      <text x="48" y="36" font-family="'DM Sans', sans-serif" font-size="10" fill="#7E998A">
        Afternoon · Medium Priority
      </text>
    </g>

    <!-- Task 3: Evening Task -->
    <g transform="translate(20, 168)">
      <rect width="380" height="48" rx="8" fill="#121212" stroke="#1E1E1E" stroke-width="1" />
      <circle cx="26" cy="24" r="10" stroke="#444444" stroke-width="1.5" fill="none" />
      <text x="48" y="20" font-family="'DM Sans', sans-serif" font-size="12" font-weight="500" fill="#F6F3ED">
        Curate minimalist outfit moodboard for Tuesday
      </text>
      <text x="48" y="36" font-family="'DM Sans', sans-serif" font-size="10" fill="#D9725B">
        Evening · Creative
      </text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- 4. BENTO POD 2: DIURNAL HORIZON & DAILY BRIEF (Right Card) -->
  <!-- ========================================================================= -->
  <g transform="translate(490, 175)" filter="url(#cardShadow)">
    <rect width="442" height="235" rx="16" fill="#0A0A0A" stroke="#1E1E1E" stroke-width="1.2" />

    <!-- Card Header -->
    <text x="24" y="34" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#D9725B" letter-spacing="1.5">
      DAILY INSIGHTS &amp; BRIEF
    </text>
    <text x="390" y="34" font-family="'DM Sans', sans-serif" font-size="10" font-weight="600" fill="#7E998A" letter-spacing="1">
      TODAY
    </text>

    <!-- Strategic Directive Box -->
    <g transform="translate(20, 48)">
      <rect width="402" height="34" rx="8" fill="#121212" stroke="#D4AF37" stroke-opacity="0.3" stroke-width="1" />
      <text x="14" y="22" font-family="'DM Sans', sans-serif" font-size="11" font-weight="600" fill="#D4AF37">
        🎯 2 priorities due today · Reading habit streak active
      </text>
    </g>

    <!-- Timeline Node 1: Voice Reflection -->
    <g transform="translate(24, 98)">
      <circle cx="14" cy="14" r="14" fill="#1E1E1E" stroke="#D9725B" stroke-width="1" />
      <circle cx="14" cy="14" r="4" fill="#D9725B" />
      <text x="38" y="12" font-family="'Bodoni Moda', Georgia, serif" font-size="13" font-weight="700" fill="#F6F3ED">
        Voice Note Recorded
      </text>
      <text x="38" y="27" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#A6A096">
        Villa reservation notes · 09:15 AM
      </text>
      <!-- Audio Waveform in Gold -->
      <g transform="translate(290, 4)" fill="#D4AF37">
        <rect x="0" y="8" width="2.5" height="10" rx="1" class="audio-bar-1" />
        <rect x="5" y="5" width="2.5" height="16" rx="1" class="audio-bar-2" />
        <rect x="10" y="10" width="2.5" height="8" rx="1" class="audio-bar-1" />
        <rect x="15" y="6" width="2.5" height="14" rx="1" class="audio-bar-2" />
      </g>
    </g>

    <!-- Timeline Node 2: Note Saved -->
    <g transform="translate(24, 142)">
      <circle cx="14" cy="14" r="14" fill="#1E1E1E" stroke="#7E998A" stroke-width="1" />
      <circle cx="14" cy="14" r="4" fill="#7E998A" />
      <text x="38" y="12" font-family="'Bodoni Moda', Georgia, serif" font-size="13" font-weight="700" fill="#F6F3ED">
        Note Saved in Study Space
      </text>
      <text x="38" y="27" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#A6A096">
        Subnetting Architecture · 11:30 AM
      </text>
    </g>

    <!-- Timeline Node 3: Habit Streak -->
    <g transform="translate(24, 186)">
      <circle cx="14" cy="14" r="14" fill="#1E1E1E" stroke="#D4AF37" stroke-width="1" />
      <polyline points="9,14 12,17 19,10" stroke="#D4AF37" stroke-width="1.8" fill="none" stroke-linecap="round" />
      <text x="38" y="12" font-family="'Bodoni Moda', Georgia, serif" font-size="13" font-weight="700" fill="#F6F3ED">
        Reading Habit Completed (14 Days)
      </text>
      <text x="38" y="27" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#A6A096">
        Daily focus block verified
      </text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- 5. FLOATING QUICK CHIPS -->
  <!-- ========================================================================= -->
  <g transform="translate(120, 428)">
    <rect width="250" height="34" rx="17" fill="#0A0A0A" stroke="#1E1E1E" stroke-width="1.2" />
    <text x="24" y="21" font-family="'DM Sans', sans-serif" font-size="11" font-weight="600" fill="#D9725B">
      📄 Note
    </text>
    <text x="104" y="21" font-family="'DM Sans', sans-serif" font-size="11" font-weight="600" fill="#D4AF37">
      🎙️ Voice
    </text>
    <text x="194" y="21" font-family="'DM Sans', sans-serif" font-size="11" font-weight="600" fill="#7E998A">
      ⊞ Pin
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- 6. FLOATING TRANSLUCENT NAVIGATION DOCK -->
  <!-- ========================================================================= -->
  <g transform="translate(240, 470)" filter="url(#cardShadow)">
    <rect width="500" height="52" rx="26" fill="#0A0A0A" stroke="#1E1E1E" stroke-width="1.2" />

    <!-- 1. Home Active Pod -->
    <g transform="translate(35, 6)">
      <rect width="70" height="40" rx="20" fill="#1A1A1A" stroke="#D9725B" stroke-width="1.2" />
      <path d="M 35 12 L 25 20 L 27 28 L 43 28 L 45 20 Z" stroke="#D9725B" stroke-width="1.5" fill="none" />
      <text x="35" y="34" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="9" font-weight="700" fill="#D9725B">
        Home •
      </text>
    </g>

    <!-- 2. Notes Tab -->
    <g transform="translate(135, 14)">
      <rect x="0" y="0" width="12" height="14" rx="2" fill="none" stroke="#A6A096" stroke-width="1.2" />
      <line x1="3" y1="4" x2="9" y2="4" stroke="#A6A096" stroke-width="1" />
      <text x="18" y="12" font-family="'DM Sans', sans-serif" font-size="10" font-weight="600" fill="#A6A096">
        Notes
      </text>
    </g>

    <!-- 3. CENTER FLOATING QUICK-ADD (+) BUTTON -->
    <g transform="translate(225, -2)" class="fab-glow">
      <circle cx="25" cy="25" r="24" fill="#D9725B" stroke="#000000" stroke-width="2" />
      <line x1="25" y1="17" x2="25" y2="33" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" />
      <line x1="17" y1="25" x2="33" y2="25" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" />
    </g>

    <!-- 4. Tasks Tab -->
    <g transform="translate(325, 14)">
      <circle cx="7" cy="7" r="6" fill="none" stroke="#A6A096" stroke-width="1.2" />
      <polyline points="4,7 6,9 10,5" stroke="#A6A096" stroke-width="1.2" fill="none" />
      <text x="18" y="12" font-family="'DM Sans', sans-serif" font-size="10" font-weight="600" fill="#A6A096">
        Tasks
      </text>
    </g>

    <!-- 5. Planner Tab -->
    <g transform="translate(405, 14)">
      <rect x="0" y="0" width="13" height="13" rx="2" fill="none" stroke="#A6A096" stroke-width="1.2" />
      <line x1="0" y1="4" x2="13" y2="4" stroke="#A6A096" stroke-width="1" />
      <text x="18" y="12" font-family="'DM Sans', sans-serif" font-size="10" font-weight="600" fill="#A6A096">
        Planner
      </text>
    </g>
  </g>

  <!-- FLOATING RIGHT QUICK ACTION (Gold Icon) -->
  <g transform="translate(865, 420)" filter="url(#cardShadow)">
    <circle cx="28" cy="28" r="28" fill="#0A0A0A" stroke="#D4AF37" stroke-width="1.5" />
    <path d="M 28 17 C 25.5 17, 23 19, 23 22 L 23 27 C 23 30, 25.5 32, 28 32 C 30.5 32, 33 30, 33 27 L 33 22 C 33 19, 30.5 17, 28 17 Z" fill="#D4AF37" />
    <path d="M 20 25 C 20 29, 23.5 34, 28 34 C 32.5 34, 36 29, 36 25" stroke="#D4AF37" stroke-width="1.5" fill="none" />
    <line x1="28" y1="34" x2="28" y2="39" stroke="#D4AF37" stroke-width="1.5" />
  </g>
</svg>
