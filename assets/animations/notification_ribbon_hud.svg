      </g>

      <!-- App Name & Timing -->
      <text x="38" y="19" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" fill="#FAF5F2" letter-spacing="0.5">
        NOTtEodo
      </text>
      <text x="104" y="19" font-family="'Space Grotesk', monospace" font-size="11" fill="#777777">
        · Daily Momentum &amp; Exact Alarms · now
