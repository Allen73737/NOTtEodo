      <!-- Exact Alarms Badge -->
      <rect x="710" y="0" width="122" height="22" rx="6" fill="#181210" stroke="#D9725B" stroke-width="0.8" />
      <text x="771" y="15" font-family="'Space Grotesk', monospace" font-size="10" font-weight="700" fill="#D9725B" text-anchor="middle">
