<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="hudBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="60%" stop-color="#080808" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Depleting progress bar gradient -->
    <linearGradient id="depleteGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FAF5F2" />
      <stop offset="40%" stop-color="#E8927C" />
      <stop offset="100%" stop-color="#D9725B" />
    </linearGradient>

    <!-- Shimmer Sweep -->
    <linearGradient id="hudShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes progressDrain {
      0% { width: 880px; opacity: 1; }
      85% { width: 30px; opacity: 0.9; }
      100% { width: 0px; opacity: 0; }
    }
    @keyframes logoPulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 3px #D9725B); }
      50% { transform: scale(1.06); filter: drop-shadow(0 0 10px #D9725B); }
    }
    @keyframes shimmerSweep {
      0% { transform: translateX(-960px) skewX(-20deg); }
      100% { transform: translateX(1100px) skewX(-20deg); }
    }
    @keyframes badgeBob {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }

    .progress-bar { animation: progressDrain 10s cubic-bezier(0.1, 0.7, 0.1, 1) infinite; }
    .monogram-mark { transform-origin: 72px 105px; animation: logoPulse 4s ease-in-out infinite; }
    .shimmer-layer { animation: shimmerSweep 6s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .flame-badge { animation: badgeBob 2.5s ease-in-out infinite; }
  </style>

  <!-- Pitch Black OLED Canvas -->
  <rect width="960" height="300" rx="20" fill="url(#hudBg)" stroke="#1E1E1E" stroke-width="1.8" />

  <!-- Shimmer Wave -->
  <rect x="0" y="0" width="300" height="300" fill="url(#hudShimmer)" class="shimmer-layer" pointer-events="none" />

  <!-- Outer Notification Container (Android Heads-Up Style) -->
  <g transform="translate(40, 36)">
    <!-- Base Card Fill -->
    <rect width="880" height="228" rx="18" fill="#0A0A0A" stroke="#221C1A" stroke-width="1.5" />

    <!-- Top Header Bar -->
    <g transform="translate(24, 20)">
      <!-- Mini Vector Ribbon Monogram Icon -->
      <rect x="0" y="0" width="28" height="28" rx="8" fill="#000000" stroke="#D9725B" stroke-width="1.2" />
