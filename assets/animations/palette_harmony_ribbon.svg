<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="100%">
  <defs>
    <filter id="swatchShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <style>
    @keyframes pulsePill {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-5px) scale(1.02); }
    }
    .sw-1 { animation: pulsePill 4s ease-in-out infinite; }
    .sw-2 { animation: pulsePill 4s ease-in-out infinite 0.5s; }
    .sw-3 { animation: pulsePill 4s ease-in-out infinite 1.0s; }
    .sw-4 { animation: pulsePill 4s ease-in-out infinite 1.5s; }
    .sw-5 { animation: pulsePill 4s ease-in-out infinite 2.0s; }
    .sw-6 { animation: pulsePill 4s ease-in-out infinite 2.5s; }
    .sw-7 { animation: pulsePill 4s ease-in-out infinite 3.0s; }
    .sw-8 { animation: pulsePill 4s ease-in-out infinite 3.5s; }
  </style>

  <!-- Pitch Black OLED Canvas -->
  <rect width="960" height="260" rx="16" fill="#000000" stroke="#1E1E1E" stroke-width="1.5" />

  <!-- Palette Header -->
  <g transform="translate(48, 32)">
    <text x="0" y="0" font-family="'Space Grotesk', 'DM Sans', sans-serif" font-size="10" font-weight="700" fill="#E2B6BB" letter-spacing="2">
      NOTTEODO SIGNATURE IVORY &amp; OXBLOOD PALETTE
    </text>
    <text x="0" y="24" font-family="'Bodoni Moda', Georgia, serif" font-size="22" font-weight="700" fill="#F6F3ED">
      Distraction-Free Ivory &amp; Pure Obsidian Tones
    </text>
    <text x="860" y="10" text-anchor="end" font-family="'DM Sans', sans-serif" font-size="10" font-weight="600" fill="#B5505E">
      ✦ ZERO YELLOW · ZERO GOLD · ZERO GREEN · ZERO BLUE ✦
    </text>
  </g>
  <line x1="48" y1="70" x2="912" y2="70" stroke="#1E1E1E" stroke-width="1" stroke-dasharray="2 4" />

  <!-- 8 MODULE SWATCH PODS (Solid Obsidian Cards) -->
  <g transform="translate(48, 85)">
    <!-- 1. Ivory Canvas #F7F3EE -->
    <g transform="translate(0, 0)" class="sw-1" filter="url(#swatchShadow)">
      <rect width="98" height="135" rx="14" fill="#0A0A0A" stroke="#1E1E1E" stroke-width="1" />
      <rect x="8" y="8" width="82" height="55" rx="8" fill="#F7F3EE" />
      <text x="49" y="82" text-anchor="middle" font-family="'Bodoni Moda', serif" font-size="12" font-weight="700" fill="#F6F3ED">Ivory</text>
      <text x="49" y="98" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#A89C9C">#F7F3EE</text>
      <text x="49" y="118" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="8" fill="#E2B6BB">Daylight Canvas</text>
    </g>

    <!-- 2. OLED Black #000000 -->
    <g transform="translate(110, 0)" class="sw-2" filter="url(#swatchShadow)">
      <rect width="98" height="135" rx="14" fill="#0A0A0A" stroke="#1E1E1E" stroke-width="1" />
      <rect x="8" y="8" width="82" height="55" rx="8" fill="#000000" stroke="#1E1E1E" stroke-width="1" />
      <text x="49" y="82" text-anchor="middle" font-family="'Bodoni Moda', serif" font-size="12" font-weight="700" fill="#F6F3ED">Pitch Black</text>
      <text x="49" y="98" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#A89C9C">#000000</text>
      <text x="49" y="118" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="8" fill="#B5505E">OLED Canvas</text>
    </g>

    <!-- 3. Deep Oxblood #7A1F2B -->
    <g transform="translate(220, 0)" class="sw-3" filter="url(#swatchShadow)">
      <rect width="98" height="135" rx="14" fill="#0A0A0A" stroke="#1E1E1E" stroke-width="1" />
      <rect x="8" y="8" width="82" height="55" rx="8" fill="#7A1F2B" />
      <text x="49" y="82" text-anchor="middle" font-family="'Bodoni Moda', serif" font-size="12" font-weight="700" fill="#F6F3ED">Deep Oxblood</text>
      <text x="49" y="98" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#E2B6BB">#7A1F2B</text>
      <text x="49" y="118" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="8" fill="#7A1F2B">Primary Action</text>
    </g>

    <!-- 4. Rosewood Oxblood #B5505E -->
    <g transform="translate(330, 0)" class="sw-4" filter="url(#swatchShadow)">
      <rect width="98" height="135" rx="14" fill="#0A0A0A" stroke="#1E1E1E" stroke-width="1" />
      <rect x="8" y="8" width="82" height="55" rx="8" fill="#B5505E" />
      <text x="49" y="82" text-anchor="middle" font-family="'Bodoni Moda', serif" font-size="12" font-weight="700" fill="#F6F3ED">Rosewood</text>
      <text x="49" y="98" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#E2B6BB">#B5505E</text>
      <text x="49" y="118" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="8" fill="#B5505E">Journal &amp; Mood</text>
    </g>

    <!-- 5. Muted Oxblood Clay #9B3B47 -->
    <g transform="translate(440, 0)" class="sw-5" filter="url(#swatchShadow)">
      <rect width="98" height="135" rx="14" fill="#0A0A0A" stroke="#1E1E1E" stroke-width="1" />
      <rect x="8" y="8" width="82" height="55" rx="8" fill="#9B3B47" />
      <text x="49" y="82" text-anchor="middle" font-family="'Bodoni Moda', serif" font-size="12" font-weight="700" fill="#F6F3ED">Oxblood Clay</text>
      <text x="49" y="98" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#E2B6BB">#9B3B47</text>
      <text x="49" y="118" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="8" fill="#9B3B47">Treasury &amp; Spend</text>
    </g>

    <!-- 6. Oxblood Blush #E2B6BB -->
    <g transform="translate(550, 0)" class="sw-6" filter="url(#swatchShadow)">
      <rect width="98" height="135" rx="14" fill="#0A0A0A" stroke="#1E1E1E" stroke-width="1" />
      <rect x="8" y="8" width="82" height="55" rx="8" fill="#E2B6BB" />
      <text x="49" y="82" text-anchor="middle" font-family="'Bodoni Moda', serif" font-size="12" font-weight="700" fill="#000000">Oxblood Blush</text>
      <text x="49" y="98" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#7A1F2B">#E2B6BB</text>
      <text x="49" y="118" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="8" fill="#B5505E">Accent Highlight</text>
    </g>

    <!-- 7. Antique Bronze #9E7B56 -->
    <g transform="translate(660, 0)" class="sw-7" filter="url(#swatchShadow)">
      <rect width="98" height="135" rx="14" fill="#0A0A0A" stroke="#1E1E1E" stroke-width="1" />
      <rect x="8" y="8" width="82" height="55" rx="8" fill="#9E7B56" />
      <text x="49" y="82" text-anchor="middle" font-family="'Bodoni Moda', serif" font-size="12" font-weight="700" fill="#F6F3ED">Warm Bronze</text>
      <text x="49" y="98" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#D2B28F">#9E7B56</text>
      <text x="49" y="118" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="8" fill="#9E7B56">Travel &amp; Passports</text>
    </g>

    <!-- 8. Obsidian Charcoal #0A0A0A -->
    <g transform="translate(770, 0)" class="sw-8" filter="url(#swatchShadow)">
      <rect width="98" height="135" rx="14" fill="#0A0A0A" stroke="#1E1E1E" stroke-width="1" />
      <rect x="8" y="8" width="82" height="55" rx="8" fill="#161311" stroke="#2E1A1D" stroke-width="1" />
      <text x="49" y="82" text-anchor="middle" font-family="'Bodoni Moda', serif" font-size="12" font-weight="700" fill="#F6F3ED">Obsidian</text>
      <text x="49" y="98" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#A89C9C">#0A0A0A</text>
      <text x="49" y="118" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="8" fill="#F6F3ED">Bento Surfaces</text>
    </g>
  </g>
</svg>
