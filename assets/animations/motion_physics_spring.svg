<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 180" width="100%" height="100%">
  <defs>
    <radialGradient id="motionBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="60%" stop-color="#0A0A0A" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <radialGradient id="mercuryGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF9E6" />
      <stop offset="30%" stop-color="#D9725B" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#D9725B" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#D9725B" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FAF5F2" stop-opacity="0.2" />
      <stop offset="30%" stop-color="#FAF5F2" />
      <stop offset="60%" stop-color="#D9725B" />
      <stop offset="100%" stop-color="#D9725B" />
    </linearGradient>
  </defs>

  <style>
    @keyframes moveMercury {
      0% { transform: translateX(60px); }
      50% { transform: translateX(860px); }
      100% { transform: translateX(60px); }
    }
    @keyframes bounceBall {
      0%, 100% { transform: translateY(0px) scale(1, 1); }
      50% { transform: translateY(45px) scale(0.9, 1.1); }
      55% { transform: translateY(50px) scale(1.2, 0.8); }
    }
    @keyframes pulseHaptic {
      0%, 100% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.6); opacity: 1; }
    }
    @keyframes waveDash {
      to { stroke-dashoffset: -100; }
    }

    .mercury-pool { animation: moveMercury 5s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite; }
    .spring-ball { transform-origin: center; animation: bounceBall 1.2s cubic-bezier(0.28, 0.84, 0.42, 1) infinite; }
    .haptic-ring { transform-origin: 750px 90px; animation: pulseHaptic 1.2s ease-out infinite; }
    .traveling-wave { stroke-dasharray: 6 6; animation: waveDash 2s linear infinite; }
  </style>

  <rect width="960" height="180" rx="14" fill="url(#motionBg)" stroke="#D9725B" stroke-width="1.2" />

  <!-- Engine Header -->
  <g font-family="'Courier New', monospace" font-size="9" fill="#D9725B" opacity="0.8" letter-spacing="2">
    <text x="30" y="28">SANCTUARY MOTION ENGINE</text>
    <text x="690" y="28">120 FPS BALISTIC HARMONICS</text>
  </g>
  <line x1="30" y1="36" x2="930" y2="36" stroke="#D9725B" stroke-opacity="0.2" stroke-dasharray="2 4" />

  <!-- Damped Harmonic Oscillator Sine Curve Background -->
  <path d="M 40 100 C 140 20, 240 160, 340 50 C 440 140, 540 70, 640 115 C 740 90, 840 105, 920 100" stroke="url(#waveGrad)" stroke-width="2.5" fill="none" opacity="0.85" class="traveling-wave" />

  <!-- Moving Liquid Mercury Specular Light Pool -->
  <g class="mercury-pool">
    <circle cx="0" cy="100" r="45" fill="url(#mercuryGlow)" />
    <circle cx="0" cy="100" r="7" fill="#FFFFFF" stroke="#D9725B" stroke-width="1" />
  </g>

  <!-- Physical Spring Bouncing Element (Left Section) -->
  <g transform="translate(180, 50)" class="spring-ball">
    <circle cx="0" cy="0" r="16" fill="#D9725B" stroke="#FEF9EE" stroke-width="2" />
    <circle cx="0" cy="0" r="6" fill="#FEF9EE" />
  </g>

  <!-- Tactile Haptic Resonance Pulse (Right Section) -->
  <circle cx="750" cy="95" r="22" stroke="#E8927C" stroke-width="1.5" fill="none" class="haptic-ring" />
  <circle cx="750" cy="95" r="8" fill="#E8927C" stroke="#000000" stroke-width="1.5" />

  <!-- Bottom Real-Time Telemetry Dashboard -->
  <line x1="30" y1="140" x2="930" y2="140" stroke="#D9725B" stroke-opacity="0.25" stroke-dasharray="1 4" />
  
  <g font-family="'DM Sans', 'Segoe UI', sans-serif" font-size="10.5" fill="#FEF9EE">
    <!-- Stat 1 -->
    <text x="35" y="160" fill="#FAF5F2" font-weight="700">REFRESH FREQUENCY</text>
    <text x="195" y="160" opacity="0.9">120 Hz ProMotion Active</text>

    <!-- Stat 2 -->
    <text x="360" y="160" fill="#D9725B" font-weight="700">FRAME RENDER BUDGET</text>
    <text x="535" y="160" opacity="0.9">8.33 ms (0.00% Jank Drops)</text>

    <!-- Stat 3 -->
    <text x="710" y="160" fill="#D9725B" font-weight="700">PHYSICS KINEMATICS</text>
    <text x="855" y="160" opacity="0.9">k = 0.52 Damped</text>
  </g>
</svg>
