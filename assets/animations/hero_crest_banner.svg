<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
  <defs>
    <!-- Oxblood Lustre Gradient -->
    <linearGradient id="oxbloodGilt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6F3ED" />
      <stop offset="30%" stop-color="#F6F3ED" />
      <stop offset="65%" stop-color="#E2B6BB" />
      <stop offset="85%" stop-color="#B5505E" />
      <stop offset="100%" stop-color="#7A1F2B" />
    </linearGradient>

    <!-- Specular Shimmer Beam -->
    <linearGradient id="shimmerBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <filter id="oxbloodGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes beamMove {
      0% { transform: translateX(-400px) skewX(-25deg); opacity: 0; }
      15% { opacity: 0.85; }
      50%, 100% { transform: translateX(960px) skewX(-25deg); opacity: 0; }
    }
    @keyframes knotPulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px #8E2433); }
      50% { transform: scale(1.05); filter: drop-shadow(0 0 14px rgba(181, 80, 94, 0.8)); }
    }
    .shimmer-pass { animation: beamMove 5.5s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .knot-logo { transform-origin: 480px 85px; animation: knotPulse 3.5s ease-in-out infinite; }
  </style>

  <!-- Pitch Black OLED Canvas -->
  <rect width="960" height="420" rx="22" fill="#000000" stroke="#1E1E1E" stroke-width="1.8" />

  <!-- Engine-Turned Geometric Rings -->
  <g opacity="0.08" stroke="#8E2433" stroke-width="0.8" fill="none">
    <circle cx="480" cy="185" r="260" stroke-dasharray="3 7" />
    <circle cx="480" cy="185" r="210" />
    <circle cx="480" cy="185" r="160" stroke-dasharray="2 5" />
    <circle cx="480" cy="185" r="110" />
    <line x1="0" y1="185" x2="960" y2="185" stroke-dasharray="4 8" />
  </g>

  <!-- Top App Navigation Ribbon -->
  <g transform="translate(48, 28)">
    <!-- Menu Hamburger -->
    <g stroke="#F6F3ED" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="0" x2="18" y2="0" />
      <line x1="0" y1="6" x2="18" y2="6" />
      <line x1="0" y1="12" x2="18" y2="12" />
    </g>

    <!-- Focus Timer Capsule: ⏱ 25:00 START -->
    <g transform="translate(685, -6)">
      <rect width="118" height="26" rx="13" fill="#0A0A0A" stroke="#8E2433" stroke-width="1.2" />
      <text x="59" y="17" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="10.5" font-weight="700" fill="#F6F3ED">
        ⏱ 25:00 <tspan fill="#E2B6BB" font-size="9">START</tspan>
      </text>
    </g>

    <!-- Avatar Circle: A -->
    <g transform="translate(825, -6)">
      <circle cx="13" cy="13" r="13" fill="#7A1F2B" stroke="#1E1E1E" stroke-width="1" />
      <text x="13" y="18" text-anchor="middle" font-family="'Bodoni Moda', Georgia, serif" font-size="13" font-weight="700" fill="#FFFFFF">A</text>
    </g>
  </g>

  <!-- NOTtEodo Ribbon Squircle Mark -->
  <g class="knot-logo" transform="translate(460, 55)">
    <rect x="0" y="0" width="40" height="40" rx="12" fill="#000000" stroke="#8E2433" stroke-width="2" />
    <path d="M 10 30 L 10 14 C 10 9 17 9 20 16 L 20 28 C 23 34 30 34 30 30 L 30 14" stroke="#E2B6BB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Main Brand Typography: NOTtEodo -->
  <g id="brandTitle" filter="url(#oxbloodGlow)">
    <text x="480" y="195" text-anchor="middle" font-family="'Bodoni Moda', 'Playfair Display', Georgia, serif" font-size="74" font-weight="700" letter-spacing="2" fill="url(#oxbloodGilt)">
      NOTtEodo
    </text>
  </g>

  <!-- Specular Moving Shimmer Mask -->
  <g mask="url(#shimmerMask)">
    <rect x="0" y="115" width="200" height="110" fill="url(#shimmerBeam)" class="shimmer-pass" />
  </g>
  <mask id="shimmerMask">
    <text x="480" y="195" text-anchor="middle" font-family="'Bodoni Moda', 'Playfair Display', Georgia, serif" font-size="74" font-weight="700" letter-spacing="2" fill="#ffffff">
      NOTtEodo
    </text>
  </mask>

  <!-- Editorial Subtitle Ribbon -->
  <g transform="translate(240, 222)">
    <rect width="480" height="28" rx="14" fill="#0A0A0A" stroke="#1E1E1E" stroke-width="1.2" />
    <text x="240" y="18" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#F6F3ED" letter-spacing="2">
      NOTES · TASKS · HABITS · EXPENSES · LIFE
    </text>
  </g>

  <!-- Editorial Mission Line -->
  <text x="480" y="280" text-anchor="middle" font-family="'Bodoni Moda', Georgia, serif" font-style="italic" font-size="16" fill="#A89C9C" letter-spacing="0.5">
    "Make space for what matters."
  </text>

  <!-- Tactical Micro Feature Chips -->
  <g transform="translate(180, 318)">
    <g transform="translate(0, 0)">
      <rect width="130" height="30" rx="8" fill="#141112" stroke="#281A1C" stroke-width="1" />
      <text x="65" y="19" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="11" font-weight="600" fill="#E2B6BB">✦ 100% Offline</text>
    </g>
    <g transform="translate(145, 0)">
      <rect width="145" height="30" rx="8" fill="#141112" stroke="#281A1C" stroke-width="1" />
      <text x="72.5" y="19" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="11" font-weight="600" fill="#B5505E">🍱 Bento &amp; Editorial</text>
    </g>
    <g transform="translate(305, 0)">
      <rect width="145" height="30" rx="8" fill="#141112" stroke="#281A1C" stroke-width="1" />
      <text x="72.5" y="19" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="11" font-weight="600" fill="#E2B6BB">🎙️ Audio Studio</text>
    </g>
    <g transform="translate(465, 0)">
      <rect width="135" height="30" rx="8" fill="#141112" stroke="#281A1C" stroke-width="1" />
      <text x="67.5" y="19" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="11" font-weight="600" fill="#7A1F2B">⏰ Exact Alarms</text>
    </g>
  </g>
</svg>
