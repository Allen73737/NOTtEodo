<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
  <defs>
    <!-- Terracotta Lustre Gradient -->
    <linearGradient id="goldGilt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5F2" />
      <stop offset="30%" stop-color="#FAF5F2" />
      <stop offset="60%" stop-color="#E8927C" />
      <stop offset="100%" stop-color="#D9725B" />
    </linearGradient>

    <!-- Specular Shimmer Beam -->
    <linearGradient id="shimmerBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes beamMove {
      0% { transform: translateX(-400px) skewX(-25deg); opacity: 0; }
      15% { opacity: 0.85; }
      50%, 100% { transform: translateX(960px) skewX(-25deg); opacity: 0; }
    }
    @keyframes knotPulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px #D9725B); }
      50% { transform: scale(1.05); filter: drop-shadow(0 0 12px #D9725B); }
    }
    .shimmer-pass { animation: beamMove 5.5s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .knot-logo { transform-origin: 480px 85px; animation: knotPulse 3.5s ease-in-out infinite; }
  </style>

  <!-- Pitch Black OLED Canvas -->
  <rect width="960" height="420" rx="22" fill="#000000" stroke="#1E1E1E" stroke-width="1.8" />

  <!-- Engine-Turned Geometric Rings -->
  <g opacity="0.08" stroke="#D9725B" stroke-width="0.8" fill="none">
    <circle cx="480" cy="185" r="260" stroke-dasharray="3 7" />
    <circle cx="480" cy="185" r="210" />
    <circle cx="480" cy="185" r="160" stroke-dasharray="2 5" />
    <circle cx="480" cy="185" r="110" />
    <line x1="0" y1="185" x2="960" y2="185" stroke-dasharray="4 8" />
  </g>

  <!-- Top App Navigation Ribbon -->
  <g transform="translate(48, 28)">
    <!-- Menu Hamburger -->
    <g stroke="#F6F3ED" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="0" x2="18" y2="0" />
      <line x1="0" y1="6" x2="18" y2="6" />
      <line x1="0" y1="12" x2="18" y2="12" />
    </g>

    <!-- Focus Timer Capsule: ⏱ 25:00 START -->
    <g transform="translate(685, -6)">
      <rect width="118" height="26" rx="13" fill="#0A0A0A" stroke="#D9725B" stroke-width="1.2" />
      <text x="59" y="17" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="10.5" font-weight="700" fill="#F6F3ED">
        ⏱ 25:00 <tspan fill="#D9725B" font-size="9">START</tspan>
      </text>
    </g>

    <!-- Avatar Circle: A -->
    <g transform="translate(825, -6)">
      <circle cx="13" cy="13" r="13" fill="#D9725B" stroke="#1E1E1E" stroke-width="1" />
      <text x="13" y="18" text-anchor="middle" font-family="'Bodoni Moda', Georgia, serif" font-size="13" font-weight="700" fill="#FFFFFF">A</text>
    </g>
  </g>

  <!-- Minimalist Hexagonal / Ribbon Mark -->
  <g class="knot-logo" transform="translate(460, 60)">
    <polygon points="20,4 36,13 36,31 20,40 4,31 4,13" fill="#D9725B" stroke="#000000" stroke-width="1.5" />
    <circle cx="20" cy="22" r="6" fill="#D9725B" />
  </g>

  <!-- Main Brand Typography -->
  <g id="brandTitle" filter="url(#goldGlow)">
    <text x="480" y="195" text-anchor="middle" font-family="'Bodoni Moda', 'Playfair Display', Georgia, serif" font-size="74" font-weight="700" letter-spacing="2" fill="url(#goldGilt)">
      Notteodo
    </text>
  </g>

  <!-- Specular Moving Shimmer Mask -->
  <g mask="url(#shimmerMask)">
    <rect x="0" y="115" width="200" height="110" fill="url(#shimmerBeam)" class="shimmer-pass" />
  </g>
  <mask id="shimmerMask">
    <text x="480" y="195" text-anchor="middle" font-family="'Bodoni Moda', 'Playfair Display', Georgia, serif" font-size="74" font-weight="700" letter-spacing="2" fill="#ffffff">
      Notteodo
    </text>
  </mask>

  <!-- Editorial Subtitle Ribbon -->
  <g transform="translate(240, 222)">
    <rect width="480" height="28" rx="14" fill="#0A0A0A" stroke="#1E1E1E" stroke-width="1.2" />
    <text x="240" y="18" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#F6F3ED" letter-spacing="2">
      NOTES · TASKS · HABITS · EXPENSES · WARDROBE · MOODBOARDS
    </text>
  </g>

  <!-- Authentic App Philosophy Quote -->
  <text x="480" y="280" text-anchor="middle" font-family="'Bodoni Moda', Georgia, serif" font-style="italic" font-size="16" fill="#A6A096">
    "Make space for what matters." · Curate your everyday.
  </text>

  <!-- Color Swatch Pills Row -->
  <g transform="translate(180, 312)">
    <!-- Pill 1: Warm Cream -->
    <rect x="0" y="0" width="85" height="26" rx="13" fill="#FEF9EE" stroke="#1E1E1E" stroke-width="1" />
    <text x="42" y="17" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="9.5" font-weight="700" fill="#1D1C15">Cream</text>

    <!-- Pill 2: Pitch Black -->
    <rect x="95" y="0" width="85" height="26" rx="13" fill="#0A0A0A" stroke="#1E1E1E" stroke-width="1" />
    <text x="137" y="17" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="9.5" font-weight="700" fill="#F6F3ED">Pitch Black</text>

    <!-- Pill 3: Terracotta -->
    <rect x="190" y="0" width="95" height="26" rx="13" fill="#D9725B" stroke="#1E1E1E" stroke-width="1" />
    <text x="237" y="17" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="9.5" font-weight="700" fill="#FFFFFF">Terracotta</text>

    <!-- Pill 4: Clay -->
    <rect x="295" y="0" width="85" height="26" rx="13" fill="#C87A5B" stroke="#1E1E1E" stroke-width="1" />
    <text x="337" y="17" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="9.5" font-weight="700" fill="#FAF5F2">Clay</text>

    <!-- Pill 5: Rose -->
    <rect x="390" y="0" width="85" height="26" rx="13" fill="#C28E8E" stroke="#1E1E1E" stroke-width="1" />
    <text x="432" y="17" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="9.5" font-weight="700" fill="#FAF5F2">Rose</text>

    <!-- Pill 6: Saddle Bronze -->
    <rect x="485" y="0" width="85" height="26" rx="13" fill="#9E7B56" stroke="#1E1E1E" stroke-width="1" />
    <text x="527" y="17" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="9.5" font-weight="700" fill="#FFFFFF">Travel</text>
  </g>

  <!-- Bottom Line -->
  <line x1="48" y1="365" x2="912" y2="365" stroke="#1E1E1E" stroke-width="1" stroke-dasharray="1 5" />
  
  <g font-family="'Courier New', monospace" font-size="9.5" fill="#D9725B" opacity="0.75" letter-spacing="2">
    <text x="48" y="392">NOTTEODO AESTHETIC LIFE DASHBOARD</text>
    <text x="480" y="392" text-anchor="middle">100% LOCAL-FIRST · ZERO ADS</text>
    <text x="912" y="392" text-anchor="end">MIT LICENSE</text>
  </g>
</svg>
