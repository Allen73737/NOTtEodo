<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 36" width="100%" height="100%">
  <defs>
    <linearGradient id="dividerGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16282C" stop-opacity="0" />
      <stop offset="30%" stop-color="#D4AF37" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#FFF5D6" stop-opacity="1" />
      <stop offset="70%" stop-color="#D4AF37" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#16282C" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    @keyframes spinDiamond {
      0% { transform: rotate(45deg) scale(1); }
      50% { transform: rotate(225deg) scale(1.2); }
      100% { transform: rotate(405deg) scale(1); }
    }
    @keyframes sweepGlint {
      0% { transform: translateX(0px); opacity: 0; }
      20% { opacity: 0.9; }
      80% { opacity: 0.9; }
      100% { transform: translateX(960px); opacity: 0; }
    }
    .diamond-center { transform-origin: 480px 18px; animation: spinDiamond 10s ease-in-out infinite; }
    .glint-pulse { animation: sweepGlint 4s linear infinite; }
  </style>

  <!-- Horizontal Tapered Line -->
  <line x1="80" y1="18" x2="880" y2="18" stroke="url(#dividerGold)" stroke-width="1.5" />
  
  <!-- Sweeping Glint -->
  <line x1="0" y1="18" x2="120" y2="18" stroke="url(#glint)" stroke-width="2" class="glint-pulse" />

  <!-- Symmetrical Dots -->
  <circle cx="360" cy="18" r="2.5" fill="#D4AF37" opacity="0.7" />
  <circle cx="420" cy="18" r="3" fill="#D4AF37" opacity="0.85" />
  <circle cx="540" cy="18" r="3" fill="#D4AF37" opacity="0.85" />
  <circle cx="600" cy="18" r="2.5" fill="#D4AF37" opacity="0.7" />

  <!-- Center Rotating Diamond Jewel -->
  <rect x="473" y="11" width="14" height="14" fill="#D4AF37" stroke="#FEF9EE" stroke-width="1.2" class="diamond-center" />
  <circle cx="480" cy="18" r="2.5" fill="#D9725B" />
</svg>
