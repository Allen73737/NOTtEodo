<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" width="100%" height="100%">
  <defs>
    <radialGradient id="skyGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="50%" stop-color="#0A0A0A" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Sun Flare Gradient -->
    <radialGradient id="sunFlare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF4D0" />
      <stop offset="40%" stop-color="#EAB368" />
      <stop offset="80%" stop-color="#D9725B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#D9725B" stop-opacity="0" />
    </radialGradient>

    <!-- Moon Glow Gradient -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#86CBB0" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#86CBB0" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="horizonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#86CBB0" stop-opacity="0" />
      <stop offset="30%" stop-color="#EAB368" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="1" />
      <stop offset="70%" stop-color="#EAB368" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#86CBB0" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    @keyframes celestialOrbit {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes astrolabeRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }
    @keyframes twinkleStar {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    @keyframes pulseCorona {
      0%, 100% { transform: scale(0.95); opacity: 0.7; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    .orbit-plane { transform-origin: 270px 180px; animation: celestialOrbit 24s linear infinite; }
    .astrolabe-grid { transform-origin: 270px 180px; animation: astrolabeRotate 60s linear infinite; }
    .star-1 { transform-origin: 120px 80px; animation: twinkleStar 3s ease-in-out infinite; }
    .star-2 { transform-origin: 420px 90px; animation: twinkleStar 4s ease-in-out infinite 1s; }
    .star-3 { transform-origin: 160px 280px; animation: twinkleStar 3.5s ease-in-out infinite 0.5s; }
    .star-4 { transform-origin: 380px 270px; animation: twinkleStar 2.5s ease-in-out infinite 1.5s; }
    .corona-pulse { transform-origin: 270px 70px; animation: pulseCorona 3s ease-in-out infinite; }
  </style>

  <rect width="540" height="360" rx="16" fill="url(#skyGrad)" stroke="#D4AF37" stroke-width="1.2" />

  <!-- Calibre & Astronomical Complication Title -->
  <g font-family="'Courier New', monospace" font-size="9" fill="#D4AF37" opacity="0.75" letter-spacing="2">
    <text x="30" y="32">ASTRONOMICAL MERIDIAN</text>
    <text x="330" y="32">EQUATION OF TIME · 24H DIAL</text>
  </g>
  <line x1="30" y1="42" x2="510" y2="42" stroke="#D4AF37" stroke-opacity="0.2" stroke-dasharray="2 4" />

  <!-- Background Twinkling Constellation Stars -->
  <g fill="#FEF9EE">
    <circle cx="120" cy="80" r="1.5" class="star-1" />
    <circle cx="150" cy="110" r="1" />
    <circle cx="100" cy="140" r="1.2" />
    <circle cx="420" cy="90" r="1.8" class="star-2" />
    <circle cx="460" cy="120" r="1.2" />
    <circle cx="390" cy="65" r="1" />
    <circle cx="160" cy="280" r="1.5" class="star-3" />
    <circle cx="380" cy="270" r="1.8" class="star-4" />
    <circle cx="210" cy="290" r="1" />
    <circle cx="330" cy="300" r="1.2" />
  </g>

  <!-- Astrolabe Celestial Coordinates Grid (Rotating counter-clockwise) -->
  <g class="astrolabe-grid" stroke="#D4AF37" stroke-opacity="0.2" fill="none" stroke-width="0.8">
    <circle cx="270" cy="180" r="120" stroke-dasharray="2 6" />
    <circle cx="270" cy="180" r="95" />
    <circle cx="270" cy="180" r="70" stroke-dasharray="4 8" />
    <circle cx="270" cy="180" r="45" />
    <line x1="270" y1="50" x2="270" y2="310" stroke-dasharray="2 4" />
    <line x1="140" y1="180" x2="400" y2="180" stroke-dasharray="2 4" />
    <line x1="178" y1="88" x2="362" y2="272" stroke-dasharray="2 4" />
    <line x1="178" y1="272" x2="362" y2="88" stroke-dasharray="2 4" />
  </g>

  <!-- Diurnal Horizon Line (Separating Sun Zenith & Nocturne Nadir) -->
  <line x1="50" y1="180" x2="490" y2="180" stroke="url(#horizonGlow)" stroke-width="2" />
  <circle cx="270" cy="180" r="5" fill="#D4AF37" />

  <!-- Horizon Labels -->
  <g font-family="'DM Sans', sans-serif" font-size="9" fill="#EAB368" letter-spacing="2">
    <text x="55" y="174">EAST · AURORA</text>
    <text x="400" y="174">WEST · VESPER</text>
    <text x="240" y="65" fill="#D4AF37">ZENITH (12H)</text>
    <text x="242" y="305" fill="#86CBB0">NADIR (00H)</text>
  </g>

  <!-- CELESTIAL ORBIT PLANE (Rotating 360-deg) -->
  <g class="orbit-plane">
    <!-- Orbital Path Ring -->
    <ellipse cx="270" cy="180" rx="110" ry="110" stroke="#D4AF37" stroke-width="1" stroke-dasharray="4 6" fill="none" opacity="0.4" />

    <!-- GOLDEN SOLAR ORB (Top Position initially) -->
    <g transform="translate(270, 70)">
      <!-- Pulsing Solar Halo -->
      <circle cx="0" cy="0" r="24" fill="url(#sunFlare)" class="corona-pulse" />
      <circle cx="0" cy="0" r="10" fill="#FFF4D0" stroke="#D4AF37" stroke-width="1.5" />
      <!-- Solar Rays -->
      <line x1="0" y1="-14" x2="0" y2="-18" stroke="#EAB368" stroke-width="1.5" />
      <line x1="0" y1="14" x2="0" y2="18" stroke="#EAB368" stroke-width="1.5" />
      <line x1="-14" y1="0" x2="-18" y2="0" stroke="#EAB368" stroke-width="1.5" />
      <line x1="14" y1="0" x2="18" y2="0" stroke="#EAB368" stroke-width="1.5" />
    </g>

    <!-- SILVER CRESCENT LUNAR ORB (Bottom Position initially) -->
    <g transform="translate(270, 290)">
      <!-- Lunar Glow -->
      <circle cx="0" cy="0" r="20" fill="url(#moonGlow)" opacity="0.6" />
      <!-- Crescent Moon Shape -->
      <path d="M -6 -8 A 10 10 0 1 0 6 8 A 8 8 0 1 1 -6 -8 Z" fill="#FEF9EE" stroke="#86CBB0" stroke-width="0.75" />
    </g>
  </g>

  <!-- Bottom Diurnal Status Readouts -->
  <line x1="30" y1="315" x2="510" y2="315" stroke="#D4AF37" stroke-opacity="0.25" stroke-dasharray="1 4" />
  
  <g font-family="'DM Sans', 'Segoe UI', sans-serif" font-size="11" fill="#FEF9EE">
    <text x="35" y="335" fill="#D4AF37" font-weight="700">SOLAR ELEVATION</text>
    <text x="35" y="350" opacity="0.85">+64.8° (Diurnal Crest)</text>

    <text x="210" y="335" fill="#86CBB0" font-weight="700">LUNAR PHASE</text>
    <text x="210" y="350" opacity="0.85">Waxing Gibbous (88%)</text>

    <text x="390" y="335" fill="#EAB368" font-weight="700">CIRCADIAN SYNC</text>
    <text x="390" y="350" opacity="0.85">Harmonized (432Hz)</text>
  </g>
</svg>
